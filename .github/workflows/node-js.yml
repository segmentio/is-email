name: Node CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Test on Node ${{ matrix.node }} and ${{ matrix.os }}

    environment:
      name: LIBRARIES_WEB

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ["10.x", "12.x"]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e  # v1
        with:
          node-version: ${{ matrix.node }}

      - name: Install deps and build (with cache)
        uses: bahmutov/npm-install@20216767ca67f0f7b4d095dc5859c5700a6581cb  # v1

      - name: Test package
        run: make test-node

      - name: Connect to Saucelabs
        uses: saucelabs/sauce-connect-action@d626d0703ca18fefd9f4bdd6bed674d966302293  # v1
        with:
          username: ${{ secrets.SAUCE_USERNAME }}
          accessKey: ${{ secrets.SAUCE_ACCESS_KEY }}
          tunnelIdentifier: github-action-tunnel
          scVersion: 4.6.4

      - name: Run Saucelabs tests
        run: make test-browser
